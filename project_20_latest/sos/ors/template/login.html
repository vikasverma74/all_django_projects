
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

{% include "Header.html" %}

<form action="/ors/Login/" method="POST">
    {% csrf_token %}

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white text-center">
                        <h1 class="mb-0">Login</h1>
                    </div>

                    <div class="card-body">

                        <div align="center">
                            {% if form.error %}
                            <h3 class="text-danger">{{ form.message }}</h3>
                            {% else %}
                            <h3 class="text-success">{{ form.message }}</h3>
                            {% endif %}
                        </div>

                        <table class="table table-borderless">
                            <tr>
                                <th>Login ID:</th>
                                <td>
                                    <input type="text" name="loginId" class="form-control">
                                    <span class="text-danger">
                                        {{ form.inputError.loginId }}
                                    </span>
                                </td>
                            </tr>

                            <tr>
                                <th>Password:</th>
                                <td>
                                    <input type="text" name="password" class="form-control">
                                    <span class="text-danger">
                                        {{ form.inputError.password }}
                                    </span>
                                </td>
                            </tr>

                            <tr>
                                <th></th>
                                <td>
                                    <input type="submit" value="signIn" class="btn btn-primary">

                                    <button type="button" class="btn btn-success">
                                        <a href="/ors/Registration/"
                                           class="text-white text-decoration-none">
                                            signUp
                                        </a>
                                    </button>
                                </td>
                            </tr>

                            <tr>
                                <th></th>
                                <td>
                                    <a href="/ors/ForgetPassword/">
                                        <b>Forget my password?</b>
                                    </a>
                                </td>
                            </tr>
                        </table>

                    </div>
                </div>

            </div>
        </div>
    </div>

</form>

</body>
</html>
