
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forget Password</title>
</head>
<body>

{% include "Header.html" %}

<form method="POST">
    {% csrf_token %}

    <div align="center">
        <h1>Forget Password</h1>

        {% if form.message %}
            {% if form.error %}
                <h3 style="color: red;">
                    {{ form.message }}
                </h3>
            {% else %}
                <h3 style="color: green;">
                    {{ form.message }}
                </h3>
            {% endif %}
        {% endif %}

        <table>
            <tr>
                <th>Login ID:</th>
                <td><input type="text" name="loginId" value="{{ form.login_id }}"></td>
                <td style="position: fixed;"><font color="red">{{ form.input_error.login_id }}</font></td>
            </tr>
            <tr>
                <th></th>
                <td>
                    <input type="submit" name="operation" value="Go">
                </td>
            </tr>
        </table>
    </div>
</form>

</body>
</html>
